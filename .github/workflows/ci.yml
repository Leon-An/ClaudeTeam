name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the floor declared in pyproject.toml / README.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The runtime shells out to tmux; unit tests stub it, but install
      # it so nothing in the suite can trip over a missing binary.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Stdlib-only gate — no `pip install` needed (run.py puts src/ on
      # the path). This is the exact command CLAUDE.md tells contributors
      # to run locally.
      - name: Run the test gate
        run: python tests/run.py
